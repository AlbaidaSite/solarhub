name: CI

# Se ejecuta al abrir o actualizar una pull request dirigida a develop o main.
on:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Type-check y tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobación estática de tipos
        run: pnpm type-check

      - name: Pruebas (unitarias, integración y componentes)
        run: pnpm test
